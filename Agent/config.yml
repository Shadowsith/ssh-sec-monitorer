# SshSecMonitorer agent configuration
# Generated by hand / via the Configurator. All intervals and retentions are in seconds.

agent:
  name: vm-example-01               # shown in the Monitorer
  output_file: /data/monitoring.json
  output_file_mode: "0644"          # must be readable for the SSH user of the Monitorer
  write_interval: 15                # how often monitoring.json is rewritten

host:
  enabled: true
  proc_path: /host/proc             # read-only mount of the host's /proc
  rootfs_path: /hostfs              # read-only mount of the host's /
  interval: 10                      # how often host metrics are read
  history_retention: 3600           # how long history points stay in monitoring.json
  cpu: true
  memory: true
  load: true
  disks:
    enabled: true
    mounts: []                      # e.g. ["/", "/var/lib/docker"]; empty = auto-discover
  network:
    enabled: true
    interfaces: []                  # empty = all except "exclude"
    exclude: ["lo", "veth*", "docker*", "br-*"]

docker:
  enabled: true
  base_url: tcp://docker-proxy:2375 # read-only docker-socket-proxy
  timeout: 10
  interval: 30                      # container list, state and stats
  stats: true
  history: true                     # per-container CPU / RAM history
  history_retention: 3600
  max_workers: 4                    # parallel stats requests
  include: []                       # container name patterns, empty = all
  exclude: []
  ports:
    enabled: true                   # show host ports published to the outside (-p / ports:)
    include_localhost: false        # also ports bound only to 127.0.0.1 / ::1
  block_io:
    enabled: true                   # disk I/O per container: current read / write rate
    totals: true                    # also cumulative bytes since container start
  logs:
    enabled: true
    interval: 60
    tail_lines: 20                  # last log lines included per container
    window: 300                     # error / warning count over the last N seconds
    max_scan_lines: 1000
    max_line_length: 500
    error_pattern: '(?i)\b(error|fatal|panic|exception|critical)\b'
    warning_pattern: '(?i)\bwarn(ing)?\b'
