<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>{{Label}}</title>
</head>
<body style="font-family: Arial, Helvetica, sans-serif; color: #212529; font-size: 14px;">
  <p style="margin: 0 0 12px 0;">
    <span style="display: inline-block; padding: 3px 10px; border-radius: 4px; color: #fff; background: {{Color}}; font-weight: bold;">{{Label}}</span>
  </p>
  <h2 style="margin: 0 0 4px 0;">{{Subject}}</h2>
  <p style="margin: 0 0 16px 0; color: #5c636a;">{{Scenario}} · Regel „{{Rule}}“</p>
  <p style="margin: 0 0 16px 0;">{{Message}}</p>
  <table style="border-collapse: collapse; font-size: 13px;">
    <tr><td style="padding: 2px 16px 2px 0; color: #5c636a;">Erkannt seit</td><td>{{Since}} (Berlin)</td></tr>
    <tr><td style="padding: 2px 16px 2px 0; color: #5c636a;">Wiederholung</td><td>{{Repeat}}</td></tr>
  </table>
  <p style="color: #6c757d; font-size: 12px; margin-top: 24px;">{{Time}} (Berlin) &middot; SshSecMonitorer</p>
</body>
</html>
